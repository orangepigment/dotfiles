# Get editor completions based on the config schema
"$schema" = "https://starship.rs/config-schema.json"

# Inserts a blank line between shell prompts
add_newline = true

[character]
success_symbol = "[](bold green)"
error_symbol = "[](bold red)"

[shell]
disabled = false
# zsh_indicator = '[z](#eb421c)sh'
zsh_indicator = "[z](bold yellow)sh"
nu_indicator = "[n](bold green)u"
elvish_indicator = "[󰘧](bold green)"
fish_indicator = "[󰈺](bold green)"

[jobs]
style = "bold yellow"

[package]
disabled = true

[cmd_duration]
disabled = true
min_time = 10_000

[directory]
truncation_symbol = "…/"

[git_branch]
format = "[$symbol$branch(:$remote_branch)]($style) "
symbol = ""

[git_status]
modified = "M"

[rust]
# format = '[$symbol($version )]($style)'
format = "[$symbol]($style)"

[python]
format = "[$symbol]($style)"

[scala]
disabled = true
format = "[$symbol]($style)"
symbol = ""

[java]
disabled = true
format = "[JVM]($style)"

[lua]
format = "via [$symbol]($style)"

[haskell]
format = "via [$symbol]($style)"

[elixir]
symbol = "🧪 "

# Redundant modules
[aws]
disabled = true

[azure]
disabled = true

[gcloud]
disabled = true

[terraform]
disabled = true

[vcs]
disabled = true

[vcsh]
disabled = true

# Custom sbt and scala modules
[custom.sbt]
command = "bat project/build.properties | rg 'sbt.version' | sd '\\s' '' | hck -Ld '=' -f 2"
detect_files = ["build.sbt"]
style = "bold white"
format = " sbt [$output]($style)"

[custom.scala]
command = "bat build.sbt | rg 'scalaVersion' | sd '\\s|\"' '' | hck -Ld '=' -f 2"
detect_files = ["build.sbt"]
style = "bold white"
format = " scala [$output]($style)"
