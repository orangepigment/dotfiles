[language-server.codebook]
command = "codebook-lsp"
args = ["serve"]
# checking while typing can be distracting; option requires v0.3.20
config = { checkWhileTyping = false }

[[language]]
name = "rust"
auto-format = true

[language-server.rust-analyzer.config.check]
command = "clippy"

[[language]]
name = "scala"
formatter = { command = "scalafmt", args = ["--stdin", "--stdout"] }
auto-format = true

[[language]]
name = "python"
language-servers = ["ty", "ruff"]
formatter = { command = "uvx", args = ["ruff", "format", "-"] }
auto-format = true

[language-server.ty]
command = "uvx"
args = ["ty", "server"]

[language-server.ty.config]
inlayHints.callArgumentNames = false
experimental.rename = true
experimental.autoImport = true

[language-server.ruff]
command = "uvx"
args = ["ruff", "server"]

[[language]]
name = "bash"
indent = { tab-width = 2, unit = "  " }
formatter = { command = "shfmt", args = ["-i", "2"] }
auto-format = true

[[language]]
name = "nu"
indent = { tab-width = 2, unit = "  " }
formatter = { command = "nufmt", args = ["--stdin"] }
auto-format = true

[language-server.expert]
command = "expert"
args = ["--stdio"]

[[language]]
name = "elixir"
language-servers = ["expert"]
formatter = { command = "mix", args = ["format", "--no-compile", "-"] }
auto-format = true

[[language]]
name = "heex"
language-servers = ["expert"]

[[language]]
name = "haskell"
auto-format = true

[[language]]
name = "toml"
file-types = ["toml", { glob = "config.ghostty" }]
auto-format = true

[[language]]
name = "markdown"
language-servers = ["markdown-oxide", "codebook"]
formatter = { command = "dprint", args = ["fmt", "--stdin", "md"] }
auto-format = true

[[language]]
name = "json"
formatter = { command = "dprint", args = ["fmt", "--stdin", "json"] }
auto-format = true

[[language]]
name = "typst"
language-servers = ["tinymist", "codebook"]
auto-format = true

# tinymist (typst lsp) settings
[language-server.tinymist]
[language-server.tinymist.config]
exportPdf = "onType"
outputPath = "$root/target/$dir/$name"
preview.background.enabled = true
preview.background.args = ["--data-plane-host=127.0.0.1:23635", "--invert-colors=never", "--open"]
